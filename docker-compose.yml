services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "${NGINX_BIND_IP:-127.0.0.1}:${NGINX_BIND_PORT:-8080}:80"
    volumes:
      - ./nginx/cyberrange.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    networks:
      - app_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    expose:
      - "8000"
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      CR_MONGO_URI: mongodb://mongodb:27017
      CR_MONGO_DB: cyberrange
      CR_DOCKER_NETWORK_NAME: cyberrange_labs
      CR_LAB_SUBNET: 172.30.0.0/16
      CR_SECRET_KEY: ${CR_SECRET_KEY:?set CR_SECRET_KEY in .env}
      CR_FLAG_SECRET: ${CR_FLAG_SECRET:?set CR_FLAG_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      - mongodb
      - docker-socket-proxy
    networks:
      - app_net
      - docker_control
    restart: unless-stopped

  mongodb:
    image: mongo:7
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      DELETE: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_control
    restart: unless-stopped

  netbird-client:
    image: netbirdio/netbird:latest
    container_name: cyberrange-netbird-web
    hostname: cyberrange-web
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    network_mode: host
    environment:
      NB_SETUP_KEY: ${NB_WEB_SETUP_KEY:?set NB_WEB_SETUP_KEY in .env}
    volumes:
      - netbird_web:/var/lib/netbird
    restart: unless-stopped

  netbird-lab-router:
    image: netbirdio/netbird:latest
    container_name: cyberrange-netbird-lab-router
    hostname: cyberrange-lab-router
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      NB_SETUP_KEY: ${NB_LAB_ROUTER_SETUP_KEY:?set NB_LAB_ROUTER_SETUP_KEY in .env}
    volumes:
      - netbird_lab_router:/var/lib/netbird
    networks:
      - lab_router_net
      - cyberrange_labs
    restart: unless-stopped

networks:
  app_net:
    driver: bridge

  docker_control:
    driver: bridge
    internal: true

  lab_router_net:
    driver: bridge

  cyberrange_labs:
    name: cyberrange_labs
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  mongo_data:
  netbird_web:
  netbird_lab_router:
