services:
  backend:
    build:
      context: ./backend
    ports:
      - "${CR_BIND_IP:-127.0.0.1}:${CR_BIND_PORT:-5000}:5000"
    environment:
      PORT: 5000
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      CR_MONGO_URI: ${CR_MONGO_URI:-mongodb://mongodb:27017}
      CR_MONGO_DB: ${CR_MONGO_DB:-cyberrange}
      CR_CONTAINER_MEMORY_LIMIT: ${CR_CONTAINER_MEMORY_LIMIT:-128m}
      CR_DOCKER_NETWORK_NAME: ${CR_DOCKER_NETWORK_NAME:-cyberrange_labs}
      CR_LAB_SUBNET: ${CR_LAB_SUBNET:-172.30.0.0/16}
      CR_SECRET_KEY: ${CR_SECRET_KEY:?set CR_SECRET_KEY in .env}
      CR_FLAG_SECRET: ${CR_FLAG_SECRET:?set CR_FLAG_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # OverlayVPN integration (optional — leave blank to disable VPN provisioning)
      VPN_V2_URL: ${VPN_V2_URL:-}
      VPN_V2_SERVICE_EMAIL: ${VPN_V2_SERVICE_EMAIL:-}
      VPN_V2_SERVICE_PASS: ${VPN_V2_SERVICE_PASS:-}
      VPN_V2_NETWORK_ID: ${VPN_V2_NETWORK_ID:-}
    depends_on:
      - docker-socket-proxy
    networks:
      - app_net
      - docker_control
    restart: unless-stopped

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      PING: 1
      POST: 1
      DELETE: 1
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SWARM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_control
    restart: unless-stopped

  vpn-lab-router:
    build:
      context: ./vpn-router
    container_name: cyberrange-vpn-lab-router
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    devices:
      - /dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      VPN_V2_URL: ${VPN_V2_URL:-http://172.17.0.1:8000}
      VPN_V2_SERVICE_EMAIL: ${VPN_V2_SERVICE_EMAIL:-}
      VPN_V2_SERVICE_PASS: ${VPN_V2_SERVICE_PASS:-}
      VPN_V2_NETWORK_ID: ${VPN_V2_NETWORK_ID:-}
      LAB_SUBNET: ${CR_LAB_SUBNET:-172.30.0.0/16}
    volumes:
      - vpn_router_data:/etc/wireguard
    networks:
      - app_net
      - cyberrange_labs
    restart: unless-stopped

networks:
  app_net:
    driver: bridge

  docker_control:
    driver: bridge
    internal: true

  cyberrange_labs:
    external: true
    name: cyberrange_labs

volumes:
  vpn_router_data:
